<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贴纸资产烘焙（一次性工具）</title>
<style>
  body { font: 13px/1.6 -apple-system, "PingFang SC", sans-serif; background: #14101e; color: #e8e0ff; padding: 20px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .cell { text-align: center; }
  .cell img { width: 96px; display: block; background: #241a3a; border-radius: 6px; }
  .ok { color: #9dff9d; } .bad { color: #ff9d9d; }
</style>
</head>
<body>
<h2>贴纸资产烘焙</h2>
<div id="log"></div>
<div class="row" id="out"></div>
<script>
const log = (m, cls='') => {
  document.getElementById('log').innerHTML += `<div class="${cls}">${m}</div>`;
};
const loadImage = src => new Promise((res, rej) => {
  const im = new Image();
  im.onload = () => res(im);
  im.onerror = () => rej(new Error('load fail: ' + src));
  im.src = src;
});
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function bake(idx, src) {
  // SVG：提取内嵌 base64 位图；PNG：直接加载
  let imgSrc = src;
  if (src.endsWith('.svg')) {
    const txt = await fetch('/assets/stickers-raw/' + src).then(r => r.text());
    const m = txt.match(/xlink:href="data:image\/png;base64,([^"]+)"/);
    if (!m) throw new Error('no embedded png');
    imgSrc = 'data:image/png;base64,' + m[1];
  }
  const img = await loadImage(imgSrc);
  const W = img.naturalWidth, H = img.naturalHeight;

  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  const d = ctx.getImageData(0, 0, W, H).data;

  // 不透明度统计 + alpha 包围盒
  let minX = W, minY = H, maxX = -1, maxY = -1, opaque = 0, total = W * H;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const o = (y * W + x) * 4;
      if (d[o + 3] > 12) {
        opaque++;
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
  }
  // 若完全不透明（黑底图），按亮度抠黑
  if (opaque >= total * 0.999) {
    for (let i = 0; i < d.length; i += 4) {
      const k = Math.max(d[i], d[i + 1], d[i + 2]);
      d[i + 3] = Math.min(255, Math.round(k * 1.6));
    }
    ctx.putImageData(new ImageData(d, W, H), 0, 0);
    log(`#${idx} 黑底已抠（亮度→alpha）`);
  }

  // 重新计算包围盒（抠黑后）并裁剪
  const d2 = ctx.getImageData(0, 0, W, H).data;
  minX = W; minY = H; maxX = -1; maxY = -1;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (d2[(y * W + x) * 4 + 3] > 14) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) { minX = 0; minY = 0; maxX = W - 1; maxY = H - 1; }
  const pad = Math.round(Math.max(maxX - minX, maxY - minY) * 0.03);
  minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
  maxX = Math.min(W - 1, maxX + pad); maxY = Math.min(H - 1, maxY + pad);
  const w = maxX - minX + 1, h = maxY - minY + 1;
  const sc = Math.min(1, 512 / Math.max(w, h));
  const out = document.createElement('canvas');
  out.width = Math.max(2, Math.round(w * sc));
  out.height = Math.max(2, Math.round(h * sc));
  out.getContext('2d').drawImage(c, minX, minY, w, h, 0, 0, out.width, out.height);

  const url = out.toDataURL('image/png');
  await fetch('/__snap?name=st' + String(idx).padStart(2, '0'), { method: 'POST', body: url });

  const pv = document.createElement('img');
  pv.src = url;
  document.getElementById('out').appendChild(pv);
}

(async () => {
  for (let i = 1; i <= 14; i++) {
    const id = String(i).padStart(2, '0');
    try {
      log(`烘焙 s${id} …`);
      await bake(i, `s${id}.svg`);
      log(`<span class="ok">s${id} ✓</span>`);
    } catch (e) {
      log(`<span class="bad">s${id} 失败：${e.message}</span>`, 'bad');
    }
    await sleep(60);
  }
  log('<b>全部完成 —— PNG 已上传到服务器 /tmp/spilled_st*.png</b>');
})();
</script>
</body>
</html>
